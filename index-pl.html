    margin-right: -2px;

    color: #fff;
    font-weight: bold;

    height: 28px;

const DAY_DESCRIPTIONS = {"Dzień 1 – sob. 6 czerwca": "Łagodna trasa po przylocie z Bari w stronę bazy, z ładnymi nadmorskimi przystankami i bez pośpiechu. Dobra na rozprostowanie nóg, pierwsze widoki na morze i spokojne wejście w klimat Apulii.", "Dzień 2 – niedz. 7 czerwca": "Bardzo łatwy lokalny dzień wokół Mesagne, żeby odpocząć, nacieszyć się noclegiem i ograniczyć jazdę do minimum. Najlepszy na spokojny spacer, słodkie przystanki, gelato i luźny pierwszy wieczór blisko bazy.", "Dzień 3 – pon. 8 czerwca": "Klasyczna pętla przez Valle d’Itria: białe miasteczka, malownicze uliczki i przystanki w piekarniach. To najładniejszy dzień miasteczkowy, raczej na krótkie spacery niż intensywne zwiedzanie.", "Dzień 4 – wt. 9 czerwca": "Zrównoważony dzień kultury i plaży: Lecce na barokowe uliczki i słodkości, potem Otranto na morze. Dobry miks dla dorosłych i dziecka, wszystko w jednym kierunku.", "Dzień 5 – śr. 10 czerwca": "Lżejszy dzień z wybrzeżem i naturą niedaleko Brindisi oraz parku wydmowego, bez dalekiej jazdy od bazy. Dobry na spokojniejsze rodzinne tempo, morskie powietrze i proste przystanki jedzeniowe.", "Dzień 6 – czw. 11 czerwca": "Najdłuższy dzień plażowy, skupiony na piaszczystym wybrzeżu południowego Salento i małych miasteczkach. Warto, jeśli wszyscy mają energię, ale plan zostawcie elastyczny i odpuśćcie miasteczko, jeśli plaża wciągnie.", "Opcja – pt. 12 czerwca A": "Dzień regeneracyjny wokół basenu, pobliskich przystanków jedzeniowych, sera i minimalnego planowania. Wybierzcie go, jeśli rodzina potrzebuje resetu po kilku dniach jazdy.", "Opcja – pt. 12 czerwca B": "Większa wyprawa w głąb lądu do Matera, Altamura i Gravina, z dramatycznymi kamiennymi miastami i piekarniami. Piękna opcja, ale zdecydowanie najbardziej wymagająca z Mesagne.", "Opcjonalnie – wyprawa na Gargano": "Spektakularna, ale bardzo długa wyprawa do lasów Gargano i na dramatyczne wybrzeże. Wybierzcie ją tylko wtedy, gdy wszyscy mają dużo energii i akceptujecie naprawdę dużo jazdy.", : 40.558, "lon": 17.809, "place": "https://www.google.com/maps/place/Alticcio+Wine+Bar+-+Vineria+Mesagne/data=!4m2!3m1!1s0x13466310e5a90bc5:0xcbd3fa098413e64a", "note": "", "emoji": "🍷", "short_description": "Zakończcie tydzień tam, gdzie zaczęliście: ostatni kieliszek Primitivo w lokalnym wine barze.", "duration": "1–2 godz."}, {"n": 4, "name": "Tenuta Donna Caterina", "label": "04. ❤️ Tenuta Donna Caterina", "source": "home", "lat": 40.565, "lon": 17.815, "place": "https://www.google.com/maps/place/Tenuta+Donna+Caterina/data=!4m2!3m1!1s0x1346628c27380ec9:0x4995ee512e3fa64d", "note": "", "emoji": "❤️", "short_description": "Powrót do willi; proste pożegnanie z Apulią bez długiej jazdy.", "duration": "baza"}]}];
const map = L.map('map').setView([40.45, 17.55], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const groups = {};
const overlays = {};

function popupHtml(day, stop) {
  return `<b>${stop.emoji || '📍'} ${stop.n}. ${stop.name}</b><br>
  ${day.day}<br>
  ${stop.short_description || ''}<br>
  ${stop.duration ? `Sugerowany postój: ~${stop.duration}<br>` : ''}
  Źródło: ${stop.source}<br>
  <a href="${stop.place}" target="_blank">Otwórz miejsce w Google Maps</a><br>
  <a href="${day.directions}" target="_blank">Otwórz dokładną trasę dnia</a>`;
}

function focusDay(dayName) {
  const day = DATA.find(d => d.day === dayName);
  if (!day) return;
  Object.values(groups).forEach(g => map.removeLayer(g));
  groups[dayName].addTo(map);
  map.fitBounds(groups[dayName].getBounds(), {padding:[25,25]});
}

DATA.forEach(day => {
  const g = L.layerGroup();
  L.polyline(day.route, {color:day.color, weight:5, opacity:0.82}).bindPopup(
    `<b>${day.day}</b><br>${day.theme}<br><a href="${day.directions}" target="_blank">Otwórz dokładną trasę w Google Maps</a>`
  ).addTo(g);
  day.stops.forEach(stop => {
    L.circleMarker([stop.lat, stop.lon], {
      radius:8, color:day.color, fillColor:day.color, fillOpacity:0.92, weight:2
    }).bindTooltip(`${stop.n}. ${stop.name}`, {permanent:false}).bindPopup(popupHtml(day, stop)).addTo(g);
  });
  groups[day.day] = g;
  overlays[`<span style="display:inline-block;width:12px;height:12px;background:${day.color};margin-right:6px;border-radius:2px;vertical-align:-1px;"></span>${day.day}`] = g;
  if (!day.day.startsWith('Wieczór/Kolacja')) {
    g.addTo(map);
  }
});


const isMobile = window.matchMedia('(max-width: 800px)').matches;
const layerControl = L.control.layers(null, overlays, {collapsed:isMobile}).addTo(map);

function collapseLayerMenu() {
  if (!isMobile) return;
  const control = document.querySelector('.leaflet-control-layers');
  if (control && control.classList.contains('leaflet-control-layers-expanded')) {
    control.classList.remove('leaflet-control-layers-expanded');
  }
}

function addLayerCloseButton() {
  if (!isMobile) return;
  const expanded = document.querySelector('.leaflet-control-layers-expanded');
  if (!expanded || expanded.querySelector('.mobile-layer-close')) return;
  const btn = document.createElement('button');
  btn.className = 'mobile-layer-close';
  btn.type = 'button';
  btn.innerHTML = '×';
  btn.setAttribute('aria-label', 'Zamknij menu warstw');
  btn.onclick = function(e) {
    e.preventDefault();
    e.stopPropagation();
    collapseLayerMenu();
  };
  expanded.insertBefore(btn, expanded.firstChild);
}

if (isMobile) {
  document.addEventListener('click', function() {
    setTimeout(addLayerCloseButton, 0);
  }, true);

  map.on('click movestart zoomstart', collapseLayerMenu);

  const sidebar = document.getElementById('sidebar');
  if (sidebar) {
    sidebar.addEventListener('scroll', collapseLayerMenu, {passive:true});
    sidebar.addEventListener('touchmove', collapseLayerMenu, {passive:true});
  }
}


const daysDiv = document.getElementById('days');
DATA.forEach(day => {
  const div = document.createElement('div');
  div.className = 'day';
  const stops = day.stops.map(s => `<div class="stop">
    <div class="stop-title">${s.emoji || '📍'} ${s.n}. ${s.name}</div>
    <div class="stop-desc">${s.short_description || ''} ${s.duration ? `<span class="stop-meta">(~${s.duration})</span>` : ''}</div>
  </div>`).join('');
  div.innerHTML = `
    <h2><span class="colorbox" style="background:${day.color}"></span>${day.day}</h2>
    <div><b>${day.theme}</b></div>
    <div class="muted">Dojazd: ${day.drive}</div>
    <p style="margin:8px 0 4px;font-size:14px;line-height:1.35;">${DAY_DESCRIPTIONS[day.day] || ''}</p>
    <a class="btn primary" href="${day.directions}" target="_blank">Otwórz dokładną trasę</a>
    <button class="btn secondary" onclick="focusDay('${day.day.replace(/'/g, "\\'")}')">Pokaż tylko ten plan</button>
    ${stops}
  `;
  daysDiv.appendChild(div);
});

const allBounds = L.latLngBounds([]);
DATA.forEach(day => {
  if (!day.day.startsWith('Wieczór/Kolacja')) {
    try { allBounds.extend(groups[day.day].getBounds()); } catch(e) {}
  }
});
map.fitBounds(allBounds, {padding:[20,20]});
</script>
