na,+Puglia&waypoints=Gonia+Pizzeria+fritti+e+cucina,+Puglia|Alticcio+Wine+Bar+-+Vineria+Mesagne,+Puglia", "color": "#5c2a2a", "route": [[40.565, 17.815], [40.558, 17.809], [40.565, 17.815]], "stops": [{"n": 1, "name": "Tenuta Donna Caterina", "label": "01. ❤️ Tenuta Donna Caterina", "source": "home", "lat": 40.565, "lon": 17.815, "place": "https://www.google.com/maps/place/Tenuta+Donna+Caterina/data=!4m2!3m1!1s0x1346628c27380ec9:0x4995ee512e3fa64d", "note": "", "emoji": "❤️", "short_description": "Start from the villa; these are adults-only evening ideas.", "duration": "base"}, {"n": 2, "name": "Gonia Pizzeria fritti e cucina", "label": "02. 🍕 Gonia Pizzeria fritti e cucina", "source": "Pizza", "lat": 40.558, "lon": 17.809, "place": "https://www.google.com/maps/place/Gonia+Pizzeria+fritti+e+cucina/data=!4m2!3m1!1s0x1346625f2cb8e1c7:0x523f8f9b92532516", "note": "", "emoji": "🍕", "short_description": "Your saved pizza spot close to the villa; fitting low-stress farewell dinner.", "duration": "1–1.5 h"}, {"n": 3, "name": "Alticcio Wine Bar - Vineria Mesagne", "label": "03. 🍷 Alticcio Wine Bar - Vineria Mesagne", "source": "Wine", "lat": 40.558, "lon": 17.809, "place": "https://www.google.com/maps/place/Alticcio+Wine+Bar+-+Vineria+Mesagne/data=!4m2!3m1!1s0x13466310e5a90bc5:0xcbd3fa098413e64a", "note": "", "emoji": "🍷", "short_description": "End the week where you started: one last glass of Primitivo at the local wine bar.", "duration": "1–2 h"}, {"n": 4, "name": "Tenuta Donna Caterina", "label": "04. ❤️ Tenuta Donna Caterina", "source": "home", "lat": 40.565, "lon": 17.815, "place": "https://www.google.com/maps/place/Tenuta+Donna+Caterina/data=!4m2!3m1!1s0x1346628c27380ec9:0x4995ee512e3fa64d", "note": "", "emoji": "❤️", "short_description": "Return to the villa; easy goodbye to Puglia without a long drive.", "duration": "base"}]}];
const map = L.map('map').setView([40.45, 17.55], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const groups = {};
const overlays = {};

function popupHtml(day, stop) {
  return `<b>${stop.emoji || '📍'} ${stop.n}. ${stop.name}</b><br>
  ${day.day}<br>
  ${stop.short_description || ''}<br>
  ${stop.duration ? `Suggested stop: ~${stop.duration}<br>` : ''}
  Source: ${stop.source}<br>
  <a href="${stop.place}" target="_blank">Open place in Google Maps</a><br>
  <a href="${day.directions}" target="_blank">Open exact day route</a>`;
}

function focusDay(dayName) {
  const day = DATA.find(d => d.day === dayName);
  if (!day) return;
  Object.values(groups).forEach(g => map.removeLayer(g));
  groups[dayName].addTo(map);
  map.fitBounds(groups[dayName].getBounds(), {padding:[25,25]});
}

DATA.forEach(day => {
  const g = L.layerGroup();
  L.polyline(day.route, {color:day.color, weight:5, opacity:0.82}).bindPopup(
    `<b>${day.day}</b><br>${day.theme}<br><a href="${day.directions}" target="_blank">Open exact route in Google Maps</a>`
  ).addTo(g);
  day.stops.forEach(stop => {
    L.circleMarker([stop.lat, stop.lon], {
      radius:8, color:day.color, fillColor:day.color, fillOpacity:0.92, weight:2
    }).bindTooltip(`${stop.n}. ${stop.name}`, {permanent:false}).bindPopup(popupHtml(day, stop)).addTo(g);
  });
  groups[day.day] = g;
  overlays[`<span style="display:inline-block;width:12px;height:12px;background:${day.color};margin-right:6px;border-radius:2px;vertical-align:-1px;"></span>${day.day}`] = g;
  if (!day.day.startsWith('Evening/Dining')) {
    g.addTo(map);
  }
});

L.control.layers(null, overlays, {collapsed:false}).addTo(map);

const daysDiv = document.getElementById('days');
DATA.forEach(day => {
  const div = document.createElement('div');
  div.className = 'day';
  const stops = day.stops.map(s => `<div class="stop">
    <div class="stop-title">${s.emoji || '📍'} ${s.n}. ${s.name}</div>
    <div class="stop-desc">${s.short_description || ''} ${s.duration ? `<span class="stop-meta">(~${s.duration})</span>` : ''}</div>
  </div>`).join('');
  div.innerHTML = `
    <h2><span class="colorbox" style="background:${day.color}"></span>${day.day}</h2>
    <div><b>${day.theme}</b></div>
    <div class="muted">Driving: ${day.drive}</div>
    <p style="margin:8px 0 4px;font-size:14px;line-height:1.35;">${DAY_DESCRIPTIONS[day.day] || ''}</p>
    <a class="btn primary" href="${day.directions}" target="_blank">Open exact route</a>
    <button class="btn secondary" onclick="focusDay('${day.day.replace(/'/g, "\\'")}')">Show only this day</button>
    ${stops}
  `;
  daysDiv.appendChild(div);
});

const allBounds = L.latLngBounds([]);
DATA.forEach(day => {
  if (!day.day.startsWith('Evening/Dining')) {
    try { allBounds.extend(groups[day.day].getBounds()); } catch(e) {}
  }
});
map.fitBounds(allBounds, {padding:[20,20]});
</script>
